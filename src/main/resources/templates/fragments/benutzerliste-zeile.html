<!-- Darstellung eines Feldes -->
<th:block th:fragment="feldausgeben(benutzerid, feldname, wert)">
    <td>
        <span th:text="${wert}"
              th:hx-swap="outerHTML"
              th:hx-get="@{/admin/benutzer/{id}/hx/feld/{feldname}(id=${benutzerid}, feldname=${feldname})}"
              ></span>
    </td>
</th:block>

<!-- Bearbeitung eines Feldes -->
<th:block th:fragment="feldbearbeiten(benutzerid, feldname, wert)">
    <td>
        <form method="post" 
                th:hx-post="@{/admin/benutzer/{id}/hx/feld/{feldname}(id=${benutzerid}, feldname=${feldname})}"
                th:hx-swap="outerHTML"
                class="d-flex">
            <div class="col-10 me-2">
                <input type="text" name ="wert" th:value="${wert}" class="form-control d-inline" th:classappend="${#fields.hasErrors('wert')} ? 'is-invalid' : ''">
            </div>
            <div class="col-2">
                <button type="submit" class="btn btn-primary">OK</button>
            </div>
            
            
        </form>
    </td>
</th:block>

<script src="https://unpkg.com/htmx.org@1.5.0"></script>
