<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot + Thymeleaf + Bootstrap</title>
</head>
<body>

    <div th:replace="~{fragments/kopffuss :: kopf}"></div>

    <div class="container pt-5">
        <div th:replace="~{fragments/kopffuss :: space}"></div>
        <div th:replace="~{fragments/info :: info}"></div>
        <h1 >
            <span th:if="${id != 0}" th:text="#{ort.titel(${id})}" ></span>
            <span th:if="${id == 0}" th:text="#{ort.titel-neu}" ></span>
        </h1>
        <form class=" my-5" th:action="@{#}" th:method="POST" th:object="${ortForm}">

            <div> 
                <ul> 
                    <li th:each="err : ${#fields.allErrors()}" th:text="${err}"/> 
                </ul> 
            </div>

            <div class="mb-3">
                <label for="nameInput" class="form-label"><span th:text="#{ort.name}"/></label>
                <input type="text" class="form-control" id="nameInput" th:field="*{name}" >
            </div>

            <div class="row">
                <div class="mb-3 col-6">
                    <label for="geobreiteInput" class="form-label"><span th:text=#{ort.breite}/></label>
                    <input type="text" class="form-control" id="geobreiteInput" th:field="*{geobreite}" >
                </div>
                <div class="mb-3 col-6">
                    <label for="geolaengeInput" class="form-label"><span th:text=#{ort.laenge}/></label>
                    <input type="text" class="form-control" id="geolaengeInput" th:field="*{geolaenge}" >
                </div>
            </div>

            <button type="submit" class="btn btn-primary">OK</button>
          </form>

        </div>
    <div th:replace="~{fragments/kopffuss :: fuss}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script type="text/javascript">
        $(function() {
            $('#datepicker').datepicker();
        });

    </script>

</body>
</html>
