<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot + Thymeleaf + Bootstrap</title>
</head>
<body>

    <div th:replace="~{fragments/kopffuss :: kopf}"></div>

    <div class="container pt-5">
        <div th:replace="~{fragments/kopffuss :: space}"></div>

        <div th:replace="~{fragments/info :: info}"></div>

        <h1 >
            <span th:text="#{ortliste.ueberschrift}"/>
        </h1>

        <table  class="table">
            <tbody>
            <tr th:if="${alleOrte.empty}">
                    <td colspan="2"><span th:text="#{ortliste.leer}"/></td>
            </tr>
            <tr th:each="ort : ${alleOrte}">
                <td><span th:text="${ort.id}"> ID </span></td>
                <td><span th:text="${ort.name}"> Name </span></td>
                <td><span th:text="${ort.geobreite}"> Geobreite </span></td>
                <td><span th:text="${ort.geolaenge}"> Geolaenge </span></td>
                <td><a class="" th:href="|https://www.openstreetmap.org/#map=14/${ort.geobreite}/${ort.geolaenge}|" target="_blank" th:text= "#{ortliste.karte}"></a></td>
                <td><a class="btn btn-outline-primary" th:href="@{/admin/ort/{id}(id=${ort.id})}" th:text= "#{ortliste.bearbeiten}"></a></td>
                <td><a class="btn btn-danger" th:href="@{/admin/ort/{id}/del(id=${ort.id})}" th:text= "#{ortliste.loeschen}"></a></td>
            </tr>
            </tbody>
        </table>

        <div class="text-end">
            <a class="btn btn-primary" th:href="@{/admin/ort/0}"><span th:text="#{ortliste.neu}"/></a>
        </div>

    </div>
    <div th:replace="~{fragments/kopffuss :: fuss}"></div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script type="text/javascript">

    </script>

</body>
</html>
