<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot + Thymeleaf + Bootstrap</title>
</head>
<body>

    <div th:replace="~{fragments/kopffuss :: kopf}"></div>

    <div class="container pt-5">
        <div th:replace="~{fragments/kopffuss :: space}"></div>

        <div th:replace="~{fragments/info :: info}"></div>

        <h1 >
            <span th:text=#{benutzerliste.ueberschrift}/>
        </h1>

        <table  class="table">
            <tbody>
            <tr th:if="${alleBenutzer.empty}">
                    <td colspan="2"><span th:text=#{benutzerliste.leer}/></td>
            </tr>
            <tr th:each="benutzer : ${alleBenutzer}">
                <td><span th:text="${benutzer.id}"> ID </span></td>

                <td th:replace="~{fragments/benutzerliste-zeile :: feldausgeben(benutzerid=${benutzer.id}, feldname='name', wert=${benutzer.name})}">Name</td>
                <td th:replace="~{fragments/benutzerliste-zeile :: feldausgeben(benutzerid=${benutzer.id}, feldname='email', wert=${benutzer.email})}">Email</td>
    
                <td><span th:text="${benutzer.geburtsdatum}"> geburtsdatum </span></td>
                <td><a class="btn btn-outline-primary" th:href="@{/admin/benutzer/{benutzerNr}(benutzerNr=${benutzer.id})}" th:text= "Bearbeiten"></a></td>
                <td><a class="btn btn-danger" th:href="@{/admin/benutzer/{benutzerNr}/del(benutzerNr=${benutzer.id})}" th:text= "Loeschen"></a></td>
            </tr>
            </tbody>
        </table>

        <div class="text-end">
            <a class="btn btn-primary" th:href="@{/admin/benutzer/0}"><span th:text=#{benutzerliste.neu}/></a>
        </div>

    </div>


    <div th:replace="~{fragments/kopffuss :: fuss}"></div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script type="text/javascript">

    </script>
    <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>


</body>
</html>
