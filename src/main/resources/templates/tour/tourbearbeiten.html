<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot + Thymeleaf + Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

    <div th:replace="~{fragments/kopffuss :: kopf}"></div>

    <div class="container pt-5">
        <div th:replace="~{fragments/kopffuss :: space}"></div>
        <div th:replace="~{fragments/info :: info}"></div>

        <h1>
            <span th:if="${id != 0}" th:text="#{tour.titel(${id})}"></span>
            <span th:if="${id == 0}" th:text="#{tour.titel-neu}"></span>
        </h1>
        <form class="my-5" th:action="@{#}" th:method="POST" th:object="${tourForm}">


            <div class="col-6 mb-3">
                <label><span th:text="#{tour.anbieter}"></span></label>
                <select class="form-select" th:field="*{anbieterId}"  th:classappend="${#fields.hasErrors('anbieterId')} ? 'is-invalid' : ''">
                    <option selected value="0">---</option>
                    <option th:each="anbieter : ${benutzerListe}" th:text="${anbieter.name}" th:value="${anbieter.id}"></option>
                 </select>
                 <div class="text-danger" th:if="${#fields.hasErrors('anbieterId')}" th:errors="*{anbieterId}"></div>
                
            </div>

            <div class="mb-3">
                <label for="zeitInput" class="form-label"><span th:text="#{tour.abfahrDateTime}"></span></label>
                <input type="datetime-local" class="form-control" id="abfahrInput" th:field="*{abfahrDateTime}" th:classappend="${#fields.hasErrors('abfahrDateTime')} ? 'is-invalid' : ''">
               <div class="text-danger" th:if="${#fields.hasErrors('abfahrDateTime')}" th:errors="*{abfahrDateTime}"></div>
            </div>

            <div class="mb-3">
                <label for="preisInput" class="form-label"><span th:text="#{tour.preis}"></span></label>
                <input type="text" class="form-control" id="preisInput" th:field="*{preis}" th:classappend="${#fields.hasErrors('preis')} ? 'is-invalid' : ''">
                <div class="text-danger" th:if="${#fields.hasErrors('preis')}" th:errors="*{preis}"></div>
            </div>

            <div class="mb-3">
                <label for="plaetzeInput" class="form-label"><span th:text="#{tour.plaetze}"></span></label>
                <input type="text" class="form-control" id="plaetzeInput" th:field="*{plaetze}" th:classappend="${#fields.hasErrors('preis')} ? 'is-invalid' : ''">
                <div class="text-danger" th:if="${#fields.hasErrors('plaetze')}" th:errors="*{plaetze}"></div>
            </div>

            <div class="row">
                <div class="mb-3 col-6">
                    <label for="startortInput" class="form-label"><span th:text="#{tour.start}"></span></label>
                    <select class="form-select"  th:field="*{startortId}" th:classappend="${#fields.hasErrors('startortId')} ? 'is-invalid' : ''">
                        <option selected value="0">---</option>
                        <option th:each="start : ${ortListe}" th:text="${start.name}" th:value="${start.id}"></option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('startortId')}" th:errors="*{startortId}"></div>
                </div>
                <div class="mb-3 col-6">
                    <label for="zielortInput" class="form-label"><span th:text="#{tour.ziel}"></span></label>
                    <select class="form-select"  th:field="*{zielortId}" th:classappend="${#fields.hasErrors('zielortId')} ? 'is-invalid' : ''">
                        <option selected value="0">---</option>
                        <option th:each="ziel : ${ortListe}" th:text="${ziel.name}" th:value="${ziel.id}"></option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('zielortId')}" th:errors="*{zielortId}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label for="infoInput" class="form-label"><span th:text="#{tour.info}"></span></label>
                <textarea class="form-control" id="infoInput" th:field="*{info}" th:classappend="${#fields.hasErrors('info')} ? 'is-invalid' : ''"></textarea>
                <div class="text-danger" th:if="${#fields.hasErrors('info')}" th:errors="*{info}"></div>
            </div>

            <button type="submit" class="btn btn-primary">OK</button>
        </form>
    </div>
    <div th:replace="~{fragments/kopffuss :: fuss}"></div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
    <script type="text/javascript">
        $(function() {
            $('').datepicker();
        });
    </script>
</body>
</html>
