<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot + Thymeleaf + Bootstrap</title>
</head>
<body>

    <div th:replace="~{fragments/kopffuss :: kopf}"></div>

    <div class="container pt-5">
        <div th:replace="~{fragments/kopffuss :: space}"></div>

        <div th:replace="~{fragments/info :: info}"></div>

        <h1 >
            <span th:text="#{tourliste.ueberschrift}"/>
        </h1>

        <table  class="table">
            <tbody>
            <tr th:if="${alleTouren == null or alleTouren.empty}">
                    <td colspan="2"><span th:text="#{tourliste.leer}"/></td>
            </tr>
            <tr th:each="tour : ${alleTouren}">
                <td><span th:text="${tour.id}"> ID </span></td>
                <td><span th:text="${tour.anbieter.name}"> anbieter </span></td>
                <td><span th:text="${tour.abfahrDateTime}"> Abfahrt </span></td>
                <td><span th:text="${tour.preis}"> Preis </span></td>
                <td><span th:text="${tour.plaetze}"> Plaetze </span></td>
                <td><span th:text="${tour.startort.name}"> Startort </span></td>
                <td><span th:text="${tour.zielort.name}"> Zielort </span></td>

                
               <td><a class="btn btn-outline-primary" th:href="@{/admin/tour/{id}(id=${tour.id})}" th:text= "#{tourliste.bearbeiten}"></a></td>
                <td><a class="btn btn-danger" th:href="@{/admin/tour/{id}/del(id=${tour.id})}" th:text= "#{tourliste.loeschen}"></a></td>
            </tr>
            </tbody>
        </table>

        <div class="text-end">
            <a class="btn btn-primary" th:href="@{/admin/tour/0}"><span th:text="#{tourliste.neu}"/></a>
        </div>

    </div>
    <div th:replace="~{fragments/kopffuss :: fuss}"></div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script type="text/javascript">

    </script>

</body>
</html>
